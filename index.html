const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="suivi-cle-"+D.sel;
async function ouvrir(raw,garder){
  const cle=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const clair=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},cle,u8(D.bloc));
  const html=new TextDecoder().decode(clair);
  // mémorisé AVANT document.write : après, ce script n'existe plus
  if(garder){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}}
  document.open();document.write(html);document.close();
}
async function deriver(mdp){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(mdp),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(D.sel),iterations:D.iter},base,256));
}
// Après le chargement : un document.write pendant l'analyse de la page
// s'insérerait dans le flux au lieu de la remplacer.
addEventListener("load",async()=>{try{const s=localStorage.getItem(K);if(s)await ouvrir(u8(s),false);}catch(e){try{localStorage.removeItem(K)}catch(_){}}});
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const e=document.getElementById("e");e.textContent="Déchiffrement…";
  try{const raw=await deriver(document.getElementById("m").value);
    await ouvrir(raw,document.getElementById("r").checked);
  }catch(err){e.textContent="Mot de passe incorrect.";}
});
})();
</script></body></html>
